# Project-wide Gradle settings.
# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8

# AndroidX package structure to make it clearer which packages are bundled with the Android operating system,
# and which are packaged with your app's APK.
android.useAndroidX=true

# Enables parallel execution of tasks across subprojects
org.gradle.parallel=true

# Enables Gradle build cache
org.gradle.caching=true
